<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrail</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>

<!-- ───────────────────────── Auth ───────────────────────── -->
<div id="auth-screen" class="auth-screen">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-mark">JT</div>
            <h1>JobTrail</h1>
            <p>Keep every application, and every step it took.</p>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab is-active" data-mode="login" role="tab">Sign in</button>
            <button class="tab" data-mode="register" role="tab">Create account</button>
        </div>

        <form id="auth-form" novalidate>
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" autocomplete="email" required placeholder="you@example.com">
            </label>
            <label class="field">
                <span>Password</span>
                <input type="password" name="password" autocomplete="current-password" required placeholder="••••••••">
            </label>
            <p id="auth-error" class="form-error" hidden></p>
            <button type="submit" class="btn btn-primary btn-block">
                <span class="btn-label">Sign in</span>
            </button>
        </form>

        <p class="auth-demo">
            Demo account — <button type="button" id="fill-demo" class="linkish">use demo@jobtrail.dev</button>
        </p>
    </div>
</div>

<!-- ───────────────────────── App ───────────────────────── -->
<div id="app-screen" hidden>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark">JT</div>
                <span>JobTrail</span>
            </div>
            <div class="topbar-actions">
                <span id="user-email" class="user-email"></span>
                <button id="logout" class="btn btn-ghost btn-sm">Sign out</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Stats -->
        <section class="stats" id="stats" aria-label="Summary"></section>

        <!-- Toolbar -->
        <section class="toolbar">
            <div class="toolbar-left">
                <h2>Applications</h2>
                <span id="result-count" class="result-count"></span>
            </div>
            <div class="toolbar-right">
                <div class="select-wrap">
                    <select id="filter-status" aria-label="Filter by status">
                        <option value="">All statuses</option>
                    </select>
                </div>
                <div class="select-wrap">
                    <select id="sort-by" aria-label="Sort by">
                        <option value="createdAt,desc">Newest first</option>
                        <option value="createdAt,asc">Oldest first</option>
                        <option value="updatedAt,desc">Recently updated</option>
                        <option value="position,asc">Role A–Z</option>
                    </select>
                </div>
                <button id="new-app" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" class="icon"><path d="M12 5v14M5 12h14"/></svg>
                    New
                </button>
            </div>
        </section>

        <!-- List -->
        <section id="list" class="list" aria-live="polite"></section>

        <!-- Pagination -->
        <nav id="pagination" class="pagination" hidden>
            <button id="prev-page" class="btn btn-ghost btn-sm">Previous</button>
            <span id="page-info" class="page-info"></span>
            <button id="next-page" class="btn btn-ghost btn-sm">Next</button>
        </nav>
    </main>
</div>

<!-- ───────────────────────── Detail drawer ───────────────────────── -->
<div id="drawer-backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Application detail">
    <div id="drawer-body"></div>
</aside>

<!-- ───────────────────────── Editor modal ───────────────────────── -->
<div id="modal-backdrop" class="backdrop" hidden></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true">
    <form id="app-form" novalidate>
        <header class="modal-head">
            <h3 id="modal-title">New application</h3>
            <button type="button" class="icon-btn" data-close-modal aria-label="Close">
                <svg viewBox="0 0 24 24" class="icon"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </header>

        <div class="modal-body">
            <div class="row">
                <label class="field">
                    <span>Company <em>*</em></span>
                    <input name="companyName" maxlength="120" required placeholder="Stripe">
                </label>
                <label class="field">
                    <span>Status</span>
                    <div class="select-wrap">
                        <select name="status" id="form-status"></select>
                    </div>
                </label>
            </div>
            <label class="field">
                <span>Role <em>*</em></span>
                <input name="position" maxlength="150" required placeholder="Senior Backend Engineer">
            </label>
            <label class="field">
                <span>Job link</span>
                <input name="jobUrl" type="url" maxlength="500" placeholder="https://…">
            </label>
            <label class="field">
                <span>Notes</span>
                <textarea name="notes" rows="3" maxlength="2000" placeholder="Referred by a friend…"></textarea>
            </label>
            <p id="form-error" class="form-error" hidden></p>
        </div>

        <footer class="modal-foot">
            <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </footer>
    </form>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
