services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtrail
      POSTGRES_USER: jobtrail
      POSTGRES_PASSWORD: jobtrail
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrail -d jobtrail"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: jobtrail
      DB_USER: jobtrail
      DB_PASSWORD: jobtrail
      JWT_SECRET: local-dev-secret-key-that-is-at-least-32-bytes
    ports:
      - "8080:8080"

volumes:
  dbdata:
